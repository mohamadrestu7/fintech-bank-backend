spring.config.import=optional:file:.env[.properties]

spring.application.name=fintech

server.port=${PORT}

# MySQL Database Connection
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret.string=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION_TIME}

# Mail configuration
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Enable TLS SMTP MAIL
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


password.reset.link=http://my-bank-frontend-deploy.s3-website-ap-southeast-2.amazonaws.com/reset-password?code=

# AWS S3 CONFIG
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretAccessKeys=${AWS_SECRET_KEY}
aws.region=ap-southeast-2
aws.s3.bucketName=${AWS_BUCKET_NAME}